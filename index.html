<html>
  <head>
    <title>assembly stats</title>
  </head>
  <body>
    <link rel="stylesheet" type="text/css" href="css/circle-plot.css?v1">
    <link rel="stylesheet" type="text/css" href="css/square-plot.css?v1">
    <link rel="stylesheet" type="text/css" href="css/table.css?v1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.2/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
    <script src="js/d3-tip.js"></script>
    <script type="text/javascript" src="js/circle-plot.js?v1"></script>
    <script type="text/javascript" src="js/square-plot.js?v1"></script>
    <script type="text/javascript" src="js/table.js?v1"></script>
    <style>
      #assembly-selector {
        position:fixed;
        top:10px;
        left:10px;
        z-index:1000;
      }
      #assembly-selector select {
        padding:5px 10px;
        font-size:14px;
        border:solid 2px #555555;
        border-radius:5px;
        background-color:#ffffff;
        color:#333333;
        cursor:pointer;
      }
      #assembly-selector select:hover {
        background-color:#f0f0f0;
      }
      html, body {
        padding:0px;
        margin:0px;
        overflow:hidden;
      }
      #assembly {
        text-align:center;
        position:fixed;
        top:0;
        left:0;
        bottom:0;
        right:0;
        font-family:helvetica,arial,sans-serif;font-size:14pt;
        overflow:hidden;
      }
      #assembly_stats {
        height:100%;
        width:100%;
      }
      .asm-tab-container {
        position:relative;width:100%;height:34px;text-align:center;
        color:#555555;
        background-color:#cccccc;
      }
      .asm-tab {
        position:relative;width:50%;height:30px;display:inline-block;
        font-size:12pt;
        line-height:30px;
        margin-left:-2px;
        margin-top:2px;
        border:solid 2px #555555;
        border-top:none;
        border-bottom:none;
        cursor:pointer;
        border-radius:17px;
      }
      .asm-tab.active {
        color:black;
        margin-top:0;
        border:solid 2px #555555;
        background-color:#bbbbbb;
      }
      .asm-tab:hover {
        margin-top:0;
        border:solid 2px #555555;
      }
      .asm-plot-container {
        position:relative;width:100%;height:90%;text-align:center;
      }
      #assembly_stats_left {
        position:relative;width:50%;height:90%;float:left;text-align:center;
      }
      #assembly_stats_right {
        position:relative;width:50%;height:90%;float:right;text-align:center;
      }
    </style>

    <div id="assembly_stats"></div>
    <div id="assembly-selector">
      <select id="asm-select"></select>
    </div>

    <script>
      var queries = window.location.href.replace(/^.+\?/,'').split('&')
      var params = []
      params["path"] = ["json/"]
      params["assembly"] = ["output"]
      params["view"] = ["circle"]
      params["altView"] = ["cumulative", "table"]
      queries.forEach(function(q){
        parts = q.split('=')
        if (!params[parts[0]]) params[parts[0]] = [];
        params[parts[0]].push(parts[1])
      })
      var assemblies = params['assembly'];
      var path = params['path'] || "json/";
      if (params['altAssembly']) assemblies = assemblies.concat(params['altAssembly'])
      var views = params['view'];
      if (!views) views = ['circle']
      var div = d3.select('div#assembly_stats')

      // Auto-discover available JSON files
      var allAssemblies = [];
      var currentAssembly = assemblies[0];
      var arr = [];
      var plot_container;

      function getAssemblyJsonName(asmName) {
        return asmName.replace('.','_');
      }

      function loadAssembly(assemblyName) {
        currentAssembly = assemblyName;
        plot_container.html('');
        arr = [];
        document.title = assemblyName + " assembly stats";
        $('#asm-select').val(assemblyName);
        d3.json(path+assemblyName+".assembly-stats.json", function(error, json) {
          if (error) { console.warn(error); return; }
          arr[0] = new Assembly(json);
          arr[0].name = getAssemblyJsonName(assemblyName);
          if (views[0] == 'circle') {
            arr[0].drawPlot('asm-plot-container');
          }
          else if (views[0] == 'cumulative') {
            arr[0].squarePlot('asm-plot-container');
            arr[0].addKey([assemblyName])
          }
          else if (views[0] == 'table') {
            arr[0].drawTable('asm-plot-container');
          }
        });
      }

      // Try to fetch directory listing, fallback to default assemblies
      function discoverAssemblies() {
        fetch(path)
          .then(function(response) { 
            if (!response.ok) throw new Error('not ok');
            return response.text(); 
          })
          .then(function(text) {
            var foundAssemblies = [];
            var regex = /<a[^>]+href="([^"]+?)\.assembly-stats[^.]*\.json"[^>]*>([^<]+)<\/a>/g;
            var match;
            while ((match = regex.exec(text)) !== null) {
              var asmName = match[2] || match[1];
              asmName = asmName.replace(/\.assembly-stats[^.]*\.json$/, '');
              if (asmName && foundAssemblies.indexOf(asmName) === -1) {
                foundAssemblies.push(asmName);
              }
            }
            if (foundAssemblies.length > 0) {
              foundAssemblies.sort();
              populateSelector(foundAssemblies);
            } else {
              populateSelector([assemblies[0]]);
            }
          })
          .catch(function() {
            populateSelector([assemblies[0]]);
          });
      }
      function populateSelector(assembliesList) {
        allAssemblies = assembliesList;
        var select = d3.select('#asm-select');
        select.selectAll('option').data(assembliesList).enter()
          .append('option')
          .attr('value', function(d){ return d; })
          .text(function(d){ return d; });
        // Set current value to first assembly (alphabetically sorted)
        currentAssembly = assembliesList[0];
        select.property('value', currentAssembly);
        // Handle selection change
        select.on('change', function() {
          var selected = d3.select(this).property('value');
          loadAssembly(selected);
        });
        // Create plot container
        plot_container = div.append('div').attr('class','asm-plot-container').attr('id','asm-plot-container');

        // Create view tabs if altView is specified
        var allViews = views.slice();
        if (params['altView']){
          allViews = allViews.concat(params['altView']);
          // generate tabs
          var tab_container = div.append('div').attr('class','asm-tab-container')
          var tabcount = allViews.length;
          var tabwidth = 100;
          for (var i = 0; i < tabcount; i++){
            var tab_div = tab_container.append('div')
                                       .attr('class',function(){if (i == 0) return 'asm-tab active'; return 'asm-tab'})
                                       .style('width',tabwidth)
                                       .text(allViews[i])
            tab_div.on('click',function(){
              d3.selectAll('.asm-tab').classed('active',false);
              d3.select(this).classed('active',true);
              var view = d3.select(this).text();
              if (view == 'circle'){
                plot_container.html('')
                if (arr[0]) arr[0].drawPlot('asm-plot-container');
              }
              else if (view == 'cumulative') {
                plot_container.html('')
                if (arr[0]) {
                  arr[0].squarePlot('asm-plot-container');
                  arr[0].addKey([currentAssembly])
                }
              }
              else if (view == 'table') {
                plot_container.html('')
                if (arr[0]) arr[0].drawTable('asm-plot-container');
              }
            })
          }
        }
        // Load initial assembly
        loadAssembly(currentAssembly);
      }

      // Start discovery
      discoverAssemblies();
      function compare (asm1,asm2){
        if (!asm1) return;
        if (!asm2) return;
        plot_container.append('div').attr('id','assembly_stats_left').append('p').text(assemblies[0]);
        plot_container.append('div').attr('id','assembly_stats_right').append('p').text(assemblies[1]);
        var span = Math.max(asm1.assembly,asm2.assembly)
        var longest = Math.max(asm1.scaffolds[0],asm2.scaffolds[0])
        asm1.drawPlot('assembly_stats_left',longest,span);
        asm2.drawPlot('assembly_stats_right',longest,span);
      }

    </script>

  </body>
</html>
